<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ML/DL Course Manager</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px; color: #2d3b45; background: #f5f5f5;
      display: flex; height: 100vh; overflow: hidden;
    }

    /* ── Sidebar ── */
    #sidebar {
      width: 240px; background: #fff; border-right: 1px solid #ddd;
      display: flex; flex-direction: column; overflow-y: auto; flex-shrink: 0;
    }
    #sidebar h2 {
      font-size: 13px; font-weight: 600; color: #555;
      padding: 16px 16px 8px; text-transform: uppercase;
      letter-spacing: 0.05em; border-bottom: 1px solid #eee; flex-shrink: 0;
    }
    .nav-static {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 16px; border-bottom: 1px solid #f0f0f0;
    }
    .nav-badge {
      background: #e0e0e0; border-radius: 20px; font-size: 11px;
      padding: 2px 8px; color: #555; font-weight: 600;
    }

    /* Group header */
    .group-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 7px 10px; cursor: pointer;
      background: #f0f4ff; border-bottom: 1px solid #d5e2fb;
      border-top: 2px solid #d5e2fb; user-select: none; flex-shrink: 0;
    }
    .group-header:hover { background: #e2ecff; }
    .grp-left { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; }
    .grp-chevron { color: #1a73e8; font-size: 9px; transition: transform 0.2s; flex-shrink: 0; }
    .grp-chevron.open { transform: rotate(90deg); }
    .grp-title-text {
      font-size: 11px; font-weight: 700; color: #1a73e8;
      text-transform: uppercase; letter-spacing: 0.06em;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100px;
    }
    .grp-title-input {
      border: none; outline: none; background: transparent;
      font-size: 11px; font-weight: 700; font-family: inherit;
      color: #1a73e8; text-transform: uppercase; letter-spacing: 0.06em;
      border-bottom: 1.5px solid #1a73e8; max-width: 100px; width: 100px; padding: 0;
    }
    .grp-badge {
      background: #1a73e8; color: #fff; border-radius: 20px;
      font-size: 10px; padding: 1px 6px; font-weight: 700; flex-shrink: 0;
    }
    .grp-actions { display: flex; gap: 1px; align-items: center; flex-shrink: 0; }
    .grp-add-btn, .grp-rename-btn, .grp-del-btn {
      background: none; border: none; cursor: pointer; padding: 2px 5px;
      border-radius: 3px; font-size: 12px; color: #7a9fd4;
      opacity: 0; transition: all 0.15s;
    }
    .group-header:hover .grp-add-btn,
    .group-header:hover .grp-rename-btn,
    .group-header:hover .grp-del-btn { opacity: 1; }
    .grp-add-btn:hover { background: #e8f0fe; color: #1a73e8 !important; }
    .grp-rename-btn:hover { background: #e8f0fe; color: #1a73e8 !important; }
    .grp-del-btn:hover { background: #fee; color: #c0392b !important; }

    /* Nav module item */
    .nav-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 9px 12px 9px 32px; cursor: pointer;
      border-bottom: 1px solid #f0f0f0; transition: background 0.1s;
    }
    .nav-item:hover { background: #f7f7f7; }
    .nav-item.active { background: #e8f0fe; border-left: 3px solid #1a73e8; padding-left: 29px; }
    .nav-item .nav-label { display: flex; align-items: center; gap: 7px; flex: 1; min-width: 0; }
    .nav-item.active .nav-label { color: #1a73e8; font-weight: 600; }
    .nav-drag { color: #ccc; font-size: 12px; cursor: grab; flex-shrink: 0; }
    .nav-title-text {
      font-size: 13px; white-space: nowrap; overflow: hidden;
      text-overflow: ellipsis; max-width: 110px;
    }
    .nav-title-input {
      border: none; outline: none; background: #fff;
      font-size: 13px; font-family: inherit; color: #1a73e8; font-weight: 600;
      border-bottom: 1.5px solid #1a73e8; max-width: 110px; width: 110px; padding: 0;
    }
    .nav-item-actions { display: flex; align-items: center; gap: 1px; flex-shrink: 0; }
    .nav-rename-btn, .nav-del-btn {
      background: none; border: none; cursor: pointer; padding: 2px 5px;
      border-radius: 3px; font-size: 11px; color: #ccc; opacity: 0; transition: all 0.15s;
    }
    .nav-item:hover .nav-rename-btn,
    .nav-item:hover .nav-del-btn { opacity: 1; }
    .nav-rename-btn:hover { background: #e8f0fe; color: #1a73e8 !important; }
    .nav-del-btn:hover { background: #fee; color: #c0392b !important; }
    .nav-item.dragging { opacity: 0.4; }
    .nav-item.drag-over { border-top: 2px solid #1a73e8; background: #f0f4ff; }

    /* Sidebar footer */
    .sidebar-footer { padding: 10px 16px; border-top: 1px solid #eee; flex-shrink: 0; }
    .add-group-btn {
      padding: 7px; background: none; border: 1px dashed #bbb; border-radius: 4px;
      color: #888; font-size: 12px; cursor: pointer; width: 100%;
      text-align: center; display: block; transition: all 0.15s;
    }
    .add-group-btn:hover { border-color: #1a73e8; color: #1a73e8; background: #f0f4ff; }

    /* ── Main ── */
    #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    #content { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }

    /* Module cards in main */
    .module-card {
      background: #fff; border: 1px solid #ddd; border-radius: 6px;
      cursor: pointer; transition: box-shadow 0.15s;
    }
    .module-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .module-card-header {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 16px; border-bottom: 1px solid #f0f0f0;
    }
    .module-card-title { font-size: 15px; font-weight: 600; flex: 1; }
    .module-card-count {
      background: #e0e0e0; border-radius: 20px; font-size: 11px;
      padding: 2px 9px; color: #555; font-weight: 600;
    }
    .module-card-goal { padding: 10px 16px; font-size: 13px; color: #666; line-height: 1.6; }

    /* Section view */
    .section-block { background: #fff; border: 1px solid #ddd; border-radius: 6px; }
    .section-header {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 16px; border-bottom: 1px solid #eee;
      cursor: pointer; user-select: none;
    }
    .section-header:hover { background: #fafafa; }
    .section-title { font-size: 14px; font-weight: 600; color: #1a73e8; flex: 1; }
    .section-count {
      background: #e8e8e8; border-radius: 20px; font-size: 11px;
      padding: 2px 8px; color: #666;
    }
    .section-chevron { color: #888; font-size: 11px; transition: transform 0.2s; }
    .section-chevron.open { transform: rotate(180deg); }
    .section-body { display: none; }
    .section-body.open { display: block; }

    .file-row {
      display: flex; align-items: center; padding: 8px 16px 8px 40px;
      gap: 10px; border-bottom: 1px solid #f2f2f2; font-size: 13px;
    }
    .file-row:hover { background: #fafafa; }
    .f-icon { font-size: 15px; }
    .f-name { flex: 1; color: #2d3b45; }
    .f-size { color: #aaa; font-size: 11px; }
    .f-remove { background: none; border: none; color: #ccc; cursor: pointer; font-size: 13px; padding: 2px 5px; border-radius: 3px; }
    .f-remove:hover { background: #fee; color: #c0392b; }

    .drop-zone {
      margin: 10px 16px 10px 40px; border: 2px dashed #d0d0d0; border-radius: 4px;
      padding: 12px; text-align: center; color: #aaa; font-size: 12px;
      cursor: pointer; transition: all 0.15s;
    }
    .drop-zone:hover, .drop-zone.dragover { border-color: #1a73e8; color: #1a73e8; background: #f0f4ff; }

    /* Breadcrumb + back button */
    .breadcrumb {
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; color: #888; margin-bottom: 4px;
    }
    .breadcrumb .back-btn {
      background: none; border: none; color: #1a73e8; cursor: pointer;
      font-size: 13px; padding: 2px 6px; border-radius: 3px;
    }
    .breadcrumb .back-btn:hover { background: #e8f0fe; }
    .page-title {
      font-size: 22px; font-weight: 700; color: #2d3b45;
      padding-bottom: 12px; border-bottom: 2px solid #eaedf0;
      margin-bottom: 16px;
    }
    .page-goal { font-size: 14px; color: #555; line-height: 1.7; margin-bottom: 16px; }
    .group-label {
      font-size: 11px; font-weight: 700; color: #1a73e8;
      text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 4px;
    }
    .group-section-block { margin-bottom: 20px; }
    .group-section-heading {
      font-size: 11px; font-weight: 700; color: #1a73e8;
      text-transform: uppercase; letter-spacing: 0.08em;
      padding: 0 0 8px; border-bottom: 2px solid #e0ecff; margin-bottom: 8px;
    }

    .add-section-btn {
      margin: 8px 0; padding: 7px 14px; background: none;
      border: 1px dashed #bbb; border-radius: 4px; color: #888;
      font-size: 12px; cursor: pointer; transition: all 0.15s;
    }
    .add-section-btn:hover { border-color: #1a73e8; color: #1a73e8; background: #f0f4ff; }

    .empty-state {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; height: 50vh; color: #aaa; gap: 12px;
    }
    .empty-state .ei { font-size: 48px; opacity: 0.4; }
    .empty-state p { font-size: 14px; text-align: center; line-height: 1.6; }

    .hidden-file { display: none; }
    .toast {
      position: fixed; bottom: 20px; right: 20px;
      background: #323232; color: #fff; padding: 10px 18px;
      border-radius: 4px; font-size: 13px; opacity: 0;
      transform: translateY(10px); transition: all 0.3s;
      pointer-events: none; z-index: 999;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>

<div id="sidebar">
  <h2>Learning Modules</h2>

  <div class="nav-static" style="background:#f7f7f7;justify-content:flex-end;">
    <span class="nav-badge" id="sidebar-count">0</span>
  </div>

  <div id="nav-module-list"></div>

  <div class="sidebar-footer">
    <button class="add-group-btn" onclick="addGroup()">+ Add Group</button>
  </div>
</div>

<div id="main">
  <div id="content">
    <div id="module-list"></div>
  </div>
</div>

<input type="file" class="hidden-file" id="global-file-input" multiple />
<div class="toast" id="toast"></div>

<script>
let groups = [];
let groupCounter = 0;
let modCounter = 0;
let selectedModId = null;
let dragSrcId = null;
let dragSrcGroupId = null;

const FILE_ICONS = {
  pdf:'📄', pptx:'📊', ipynb:'📓', py:'🐍',
  csv:'📋', zip:'📦', mp4:'🎬', png:'🖼️', pt:'⚙️', h5:'🗃️', default:'📁'
};

function getExt(n){ return n.split('.').pop().toLowerCase(); }
function getIcon(n){ return FILE_ICONS[getExt(n)] || FILE_ICONS.default; }
function fmtSize(b){ if(b<1024)return b+' B'; if(b<1048576)return(b/1024).toFixed(1)+' KB'; return(b/1048576).toFixed(1)+' MB'; }
function escHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }

function findMod(modId){
  for(const g of groups){ const m=g.modules.find(m=>m.id===modId); if(m)return{group:g,mod:m}; }
  return null;
}
function allMods(){ return groups.flatMap(g=>g.modules); }

/* ── Add Group ── */
function addGroup(){
  groupCounter++;
  const id='grp-'+groupCounter;
  groups.push({id,title:'New Group',open:true,modules:[]});
  renderAll();
  setTimeout(()=>startRenameGroup(id),30);
}

/* ── Add Module ── */
function addModule(groupId){
  const g=groups.find(g=>g.id===groupId);
  if(!g)return;
  modCounter++;
  const id='mod-'+modCounter;
  g.modules.push({id,title:'New Module',goal:'',sections:[],open:false});
  renderAll();
  setTimeout(()=>startRenameNav(id),30);
}

/* ── Remove Group ── */
function removeGroup(groupId){
  const g=groups.find(g=>g.id===groupId);
  if(!g)return;
  if(g.modules.some(m=>m.id===selectedModId))selectedModId=null;
  groups=groups.filter(g=>g.id!==groupId);
  renderAll();
  toast('Group deleted.');
}

/* ── Remove Module ── */
function removeModule(modId){
  for(const g of groups){
    const i=g.modules.findIndex(m=>m.id===modId);
    if(i!==-1){
      g.modules.splice(i,1);
      if(selectedModId===modId)selectedModId=null;
      renderAll(); return;
    }
  }
}

/* ── Toggle Group ── */
function toggleGroup(groupId){
  const g=groups.find(g=>g.id===groupId);
  if(g){g.open=!g.open; renderAll();}
}

/* ── File handling ── */
function handleFiles(files,secId){
  for(const mod of allMods()){
    const sec=mod.sections.find(s=>s.id===secId);
    if(sec){
      [...files].forEach(f=>{ if(!sec.files.find(x=>x.name===f.name))sec.files.push({name:f.name,size:f.size}); });
      renderAll(); toast('Files added.'); return;
    }
  }
}
function onDragOver(e,sid){ e.preventDefault(); const d=document.querySelector(`[data-dz="${sid}"]`); if(d)d.classList.add('dragover'); }
function onDragLeave(e,sid){ const d=document.querySelector(`[data-dz="${sid}"]`); if(d)d.classList.remove('dragover'); }
function onDrop(e,sid){ e.preventDefault(); onDragLeave(e,sid); handleFiles(e.dataTransfer.files,sid); }
function triggerUpload(secId){ const i=document.createElement('input'); i.type='file'; i.multiple=true; i.onchange=()=>handleFiles(i.files,secId); i.click(); }

function addSection(modId){
  const f=findMod(modId); if(!f)return;
  const sid=modId+'-sec-'+Date.now();
  f.mod.sections.push({id:sid,title:'New Section',files:[],open:true});
  renderAll();
  setTimeout(()=>{ const inp=document.querySelector(`[data-sec-id="${sid}"] .sec-inp`); if(inp){inp.focus();inp.select();} },50);
}

function removeFile(secId,idx){
  for(const mod of allMods()){
    const sec=mod.sections.find(s=>s.id===secId);
    if(sec){sec.files.splice(idx,1);renderAll();return;}
  }
}

function toggleSection(secId){
  for(const mod of allMods()){
    const sec=mod.sections.find(s=>s.id===secId);
    if(sec){sec.open=!sec.open;renderAll();return;}
  }
}

/* ── Rename Group ── */
function startRenameGroup(groupId){
  const group=groups.find(g=>g.id===groupId); if(!group)return;
  const span=document.querySelector(`.grp-title-text[data-grp-id="${groupId}"]`); if(!span)return;
  const inp=document.createElement('input');
  inp.type='text'; inp.className='grp-title-input'; inp.value=group.title;
  span.parentNode.replaceChild(inp,span);
  inp.focus(); inp.select();
  let saved=false;
  const save=()=>{ if(saved)return; saved=true; const v=inp.value.trim(); if(v)group.title=v; renderAll(); if(v)toast('Group renamed to "'+group.title+'"'); };
  inp.addEventListener('blur',save);
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter')inp.blur(); if(e.key==='Escape'){saved=true;renderAll();} e.stopPropagation(); });
  inp.addEventListener('click',e=>e.stopPropagation());
}

/* ── Rename Module ── */
function startRenameNav(modId){
  const f=findMod(modId); if(!f)return;
  const span=document.querySelector(`.nav-title-text[data-mod-id="${modId}"]`); if(!span)return;
  const inp=document.createElement('input');
  inp.type='text'; inp.className='nav-title-input'; inp.value=f.mod.title;
  span.parentNode.replaceChild(inp,span);
  inp.focus(); inp.select();
  let saved=false;
  const save=()=>{ if(saved)return; saved=true; const v=inp.value.trim(); if(v)f.mod.title=v; renderAll(); if(v)toast('Module renamed to "'+f.mod.title+'"'); };
  inp.addEventListener('blur',save);
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter')inp.blur(); if(e.key==='Escape'){saved=true;renderAll();} e.stopPropagation(); });
  inp.addEventListener('click',e=>e.stopPropagation());
}

function selectModule(modId){ selectedModId=modId; renderAll(); }

/* ── Render ── */
function renderAll(){
  const navList=document.getElementById('nav-module-list');
  navList.innerHTML='';
  document.getElementById('sidebar-count').textContent=allMods().length;

  groups.forEach(group=>{
    // Group header
    const grpEl=document.createElement('div');
    grpEl.className='group-header';
    grpEl.dataset.grpId=group.id;
    grpEl.innerHTML=`
      <div class="grp-left">
        <span class="grp-chevron ${group.open?'open':''}">▶</span>
        <span class="grp-title-text" data-grp-id="${group.id}" title="Double-click to rename">${escHtml(group.title)}</span>
        <span class="grp-badge">${group.modules.length}</span>
      </div>
      <div class="grp-actions">
        <button class="grp-add-btn"    title="Add module" onclick="event.stopPropagation();addModule('${group.id}')">＋</button>
        <button class="grp-rename-btn" title="Rename group" onclick="event.stopPropagation();startRenameGroup('${group.id}')">✎</button>
        <button class="grp-del-btn"    title="Delete group" onclick="event.stopPropagation();removeGroup('${group.id}')">✕</button>
      </div>
    `;
    grpEl.addEventListener('click',()=>toggleGroup(group.id));
    grpEl.querySelector('.grp-title-text').addEventListener('dblclick',e=>{e.stopPropagation();startRenameGroup(group.id);});
    navList.appendChild(grpEl);

    if(!group.open)return;

    group.modules.forEach(mod=>{
      const navEl=document.createElement('div');
      navEl.className='nav-item'+(selectedModId===mod.id?' active':'');
      navEl.draggable=true; navEl.dataset.modId=mod.id;
      navEl.innerHTML=`
        <div class="nav-label">
          <span class="nav-drag">⠿</span>
          <span class="nav-title-text" data-mod-id="${mod.id}" title="Double-click to rename">${escHtml(mod.title)}</span>
        </div>
        <div class="nav-item-actions">
          <button class="nav-rename-btn" title="Rename" onclick="event.stopPropagation();startRenameNav('${mod.id}')">✎</button>
          <button class="nav-del-btn"    title="Delete" onclick="event.stopPropagation();removeModule('${mod.id}')">✕</button>
        </div>
      `;
      navEl.onclick=()=>selectModule(mod.id);
      navEl.querySelector('.nav-title-text').addEventListener('dblclick',e=>{e.stopPropagation();startRenameNav(mod.id);});

      navEl.addEventListener('dragstart',e=>{dragSrcId=mod.id;dragSrcGroupId=group.id;navEl.classList.add('dragging');e.dataTransfer.effectAllowed='move';});
      navEl.addEventListener('dragend',()=>{navEl.classList.remove('dragging');document.querySelectorAll('.nav-item.drag-over').forEach(el=>el.classList.remove('drag-over'));});
      navEl.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='move';document.querySelectorAll('.nav-item.drag-over').forEach(el=>el.classList.remove('drag-over'));if(dragSrcId!==mod.id)navEl.classList.add('drag-over');});
      navEl.addEventListener('dragleave',()=>navEl.classList.remove('drag-over'));
      navEl.addEventListener('drop',e=>{
        e.preventDefault();navEl.classList.remove('drag-over');
        if(dragSrcId&&dragSrcId!==mod.id){
          const srcG=groups.find(g=>g.id===dragSrcGroupId);
          if(srcG){const fi=srcG.modules.findIndex(m=>m.id===dragSrcId);const[mv]=srcG.modules.splice(fi,1);const ti=group.modules.findIndex(m=>m.id===mod.id);group.modules.splice(ti,0,mv);}
          dragSrcId=null;dragSrcGroupId=null;renderAll();
        }
      });
      navList.appendChild(navEl);
    });
  });

  /* Main area */
  const container=document.getElementById('module-list');
  container.innerHTML='';

  if(selectedModId){
    const found=findMod(selectedModId);
    if(found){
      const{group,mod}=found;

      // Breadcrumb
      const bc=document.createElement('div');
      bc.className='breadcrumb';
      bc.innerHTML=`
        <button class="back-btn" onclick="selectedModId=null;renderAll()">← Back</button>
        <span>›</span>
        <span style="color:#1a73e8;font-weight:600;">${escHtml(group.title)}</span>
        <span>›</span>
        <span>${escHtml(mod.title)}</span>
      `;
      container.appendChild(bc);

      const ttl=document.createElement('div'); ttl.className='page-title'; ttl.textContent=mod.title;
      container.appendChild(ttl);

      if(mod.goal){
        const gl=document.createElement('div'); gl.className='page-goal'; gl.textContent='🎯 '+mod.goal;
        container.appendChild(gl);
      }

      mod.sections.forEach(sec=>{
        const sb=document.createElement('div'); sb.className='section-block'; sb.style.marginBottom='12px';
        sb.dataset.secId=sec.id;
        sb.innerHTML=`
          <div class="section-header" onclick="toggleSection('${sec.id}')">
            <span style="color:#1a73e8;">📁</span>
            <span class="section-title">${escHtml(sec.title)}</span>
            <span class="section-count">${sec.files.length} file${sec.files.length!==1?'s':''}</span>
            <span class="section-chevron ${sec.open?'open':''}">▼</span>
          </div>
          <div class="section-body ${sec.open?'open':''}">
            ${sec.files.map((f,i)=>`
              <div class="file-row">
                <span class="f-icon">${getIcon(f.name)}</span>
                <span class="f-name">${escHtml(f.name)}</span>
                <span class="f-size">${fmtSize(f.size)}</span>
                <button class="f-remove" onclick="removeFile('${sec.id}',${i})">✕</button>
              </div>
            `).join('')}
            <div class="drop-zone" data-dz="${sec.id}"
              ondragover="onDragOver(event,'${sec.id}')"
              ondragleave="onDragLeave(event,'${sec.id}')"
              ondrop="onDrop(event,'${sec.id}')"
              onclick="triggerUpload('${sec.id}')">
              ⬆ Drop files or click to upload
            </div>
          </div>
        `;
        container.appendChild(sb);
      });

      const addBtn=document.createElement('button');
      addBtn.className='add-section-btn';
      addBtn.textContent='+ Add Section';
      addBtn.onclick=()=>addSection(mod.id);
      container.appendChild(addBtn);
    }
  } else {
    // Overview: show all groups with module cards
    let hasAny=false;
    groups.forEach(group=>{
      if(group.modules.length===0)return;
      hasAny=true;
      const sec=document.createElement('div'); sec.className='group-section-block';
      sec.innerHTML=`<div class="group-section-heading">${escHtml(group.title)}</div>`;
      group.modules.forEach(mod=>{
        const card=document.createElement('div');
        card.className='module-card';
        card.style.marginBottom='8px';
        card.innerHTML=`
          <div class="module-card-header">
            <span style="color:#1a73e8;font-size:16px;">📘</span>
            <span class="module-card-title">${escHtml(mod.title)}</span>
            <span class="module-card-count">${mod.sections.length} section${mod.sections.length!==1?'s':''}</span>
            <span style="color:#bbb;">›</span>
          </div>
          ${mod.goal?`<div class="module-card-goal">${escHtml(mod.goal)}</div>`:''}
        `;
        card.onclick=()=>selectModule(mod.id);
        sec.appendChild(card);
      });
      container.appendChild(sec);
    });

    if(!hasAny){
      container.innerHTML=`
        <div class="empty-state">
          <div class="ei">📚</div>
          <p>No modules yet.<br>Add a group in the sidebar, then use the <strong>＋</strong> button to add modules.</p>
        </div>
      `;
    }
  }
}

/* ── Seed Data ── */
function mkMod(title,goal,secs){
  modCounter++;
  const id='mod-'+modCounter;
  return{id,title,goal,sections:secs.map(t=>({id:id+'-sec-'+Math.random().toString(36).slice(2),title:t,files:[],open:false})),open:false};
}

  mkMod('M5: Transformers & Attention', 'Self-attention, BERT, ViT, scaling laws.',                        ['Lecture Slides','Lab Notebooks']),
  mkMod('M6: Efficient AI',             'Model compression, quantization, pruning, energy-aware training.',['Lecture Slides','Papers','Lab Notebooks']),

renderAll();
